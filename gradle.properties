org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP (as of mid-2026) still registers its generated source dirs via the old
# kotlin.sourceSets{} DSL, which AGP 9's built-in Kotlin rejects by default
# ("Using kotlin.sourceSets DSL to add Kotlin sources is not allowed").
# This is a documented, Google-sanctioned escape hatch (not a hack) until
# KSP ships a build fully aligned with the new DSL:
# https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

# AGP 9 introduced a new DSL/variant API. Uncomment if a third-party plugin
# in this project breaks against it:
# android.newDsl=false
